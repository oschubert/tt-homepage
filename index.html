<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oschubertt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>Coming soon...</h1>
        <p class="subtitle">oschubertt</p>        
    </div>
</body>
</html>
